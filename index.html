<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Appel — La Queerale</title>
<style>
  :root {
    --bg: #1a0a1e;
    --surface: #2a1030;
    --border: #5a2060;
    --pink: #f472b6;
    --pink-light: #fce7f3;
    --lime: #a3e635;
    --lime-dark: #65a30d;
    --white: #fdf4ff;
    --muted: #c084fc;
    --text: #fdf4ff;

    --present: #a3e635;
    --present-text: #1a2e05;
    --prevu: #f472b6;
    --prevu-text: #4a0020;
    --autre: #94a3b8;
    --autre-text: #0f172a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  .app-header {
    display: flex; align-items: center; justify-content: center;
    padding: 1.2rem 1.5rem .8rem;
    border-bottom: 1px solid var(--border);
    gap: .8rem;
  }
  .app-header img {
    width: 48px; height: 48px; border-radius: 50%;
    object-fit: cover;
  }
  .app-header .header-title {
    font-size: 1.3rem; font-weight: 800;
    background: linear-gradient(135deg, var(--pink), var(--lime));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ACCUEIL */
  #screen-home { display: flex; flex-direction: column; align-items: center; padding: 1.5rem 1rem 2rem; }
  .home-subtitle { color: var(--muted); font-size: .9rem; margin-bottom: 1.5rem; text-align: center; }

  /* Date répét */
  .repet-badge {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: .5rem 1rem;
    font-size: .82rem; color: var(--muted); margin-bottom: 1.8rem;
    text-align: center;
  }
  .repet-badge strong { color: var(--lime); }

  .voice-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 1rem; width: 100%; max-width: 400px;
  }
  .voice-btn {
    background: var(--surface); border: 2px solid var(--border);
    border-radius: 16px; overflow: hidden;
    font-size: 1rem; font-weight: 700; color: var(--text);
    cursor: pointer; transition: all .2s;
    display: flex; flex-direction: column; align-items: center;
    padding-bottom: .9rem;
  }
  .voice-btn:hover { border-color: var(--pink); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(244,114,182,.2); }
  .voice-btn:focus-visible { outline: 3px solid var(--lime); outline-offset: 2px; }
  .voice-img {
    width: 100%; aspect-ratio: 1;
    object-fit: cover; margin-bottom: .6rem;
    background: #2a1030;
  }
  .voice-label { font-size: .95rem; }

  /* APPEL */
  #screen-appel { display: none; }
  .top-bar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: .8rem 1.2rem;
    display: flex; align-items: center; gap: .8rem;
  }
  .back-btn {
    background: none; border: 1px solid var(--border);
    border-radius: 8px; padding: .35rem .7rem;
    color: var(--muted); cursor: pointer; font-size: .85rem;
    transition: all .15s;
  }
  .back-btn:hover { color: var(--text); border-color: var(--pink); }
  .back-btn:focus-visible { outline: 3px solid var(--lime); }
  .top-info { flex: 1; }
  .top-voice { font-weight: 800; font-size: 1.05rem;
    background: linear-gradient(135deg, var(--pink), var(--lime));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .top-date { font-size: .78rem; color: var(--muted); margin-top: .1rem; }
  .top-count { font-size: .85rem; color: var(--lime); font-weight: 700; }

  /* LÉGENDE */
  .legend {
    display: flex; gap: .5rem; flex-wrap: wrap;
    padding: .7rem 1rem; justify-content: center;
    border-bottom: 1px solid var(--border);
  }
  .leg {
    font-size: .75rem; display: flex; align-items: center; gap: .3rem;
    background: var(--surface); border-radius: 20px; padding: .25rem .6rem;
    color: var(--text);
  }
  .leg-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  /* LISTE */
  .choriste-list { padding: .7rem; display: flex; flex-direction: column; gap: .45rem; }

  .choriste-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 12px; padding: .75rem .9rem;
    display: flex; align-items: center; gap: .7rem;
    transition: border-color .15s;
  }
  .choriste-name { flex: 1; font-size: .95rem; font-weight: 500; }
  .status-btns { display: flex; gap: .35rem; }

  .s-btn {
    border-radius: 8px; border: 1.5px solid var(--border);
    cursor: pointer; font-size: .72rem; font-weight: 700;
    padding: .3rem .45rem; background: var(--bg);
    color: var(--muted); transition: all .15s; white-space: nowrap;
    line-height: 1.2;
  }
  .s-btn:hover { transform: scale(1.05); border-color: var(--pink); color: var(--text); }
  .s-btn:focus-visible { outline: 2px solid var(--lime); }

  .s-btn.active-present  { background: var(--present);  border-color: var(--present);  color: var(--present-text); }
  .s-btn.active-prevu    { background: var(--prevu);    border-color: var(--prevu);    color: var(--prevu-text); }
  .s-btn.active-autre    { background: var(--autre);    border-color: var(--autre);    color: var(--autre-text); }

  .choriste-card.done-present  { border-color: var(--present); }
  .choriste-card.done-prevu    { border-color: var(--prevu); }
  .choriste-card.done-autre    { border-color: var(--autre); }

  /* NOTE PRÉ-REMPLISSAGE */
  .prefill-note {
    margin: .5rem .7rem 0;
    background: rgba(163,230,53,.08); border: 1px solid rgba(163,230,53,.25);
    border-radius: 10px; padding: .6rem .9rem;
    font-size: .8rem; color: var(--lime);
    display: flex; align-items: center; gap: .5rem;
  }

  /* BARRE ENVOI */
  .send-bar {
    position: sticky; bottom: 0;
    background: var(--bg); border-top: 1px solid var(--border);
    padding: .9rem 1.2rem;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  }
  .send-info { font-size: .82rem; color: var(--muted); line-height: 1.4; }
  .send-info strong { color: var(--text); }
  .send-btn {
    background: linear-gradient(135deg, var(--pink), #a855f7);
    border: none; border-radius: 12px;
    padding: .75rem 1.4rem; color: #fff; font-size: .92rem; font-weight: 800;
    cursor: pointer; transition: opacity .2s; white-space: nowrap;
  }
  .send-btn:disabled { opacity: .35; cursor: not-allowed; }
  .send-btn:not(:disabled):hover { opacity: .85; }
  .send-btn:focus-visible { outline: 3px solid var(--lime); }

  /* TOAST */
  #toast {
    position: fixed; bottom: 5.5rem; left: 50%; transform: translateX(-50%);
    background: #2a1030; border: 1px solid var(--pink);
    border-radius: 10px; padding: .7rem 1.2rem;
    font-size: .88rem; color: var(--text); pointer-events: none;
    opacity: 0; transition: opacity .3s; white-space: nowrap; z-index: 99;
  }
  #toast.show { opacity: 1; }

  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<!-- APPEL -->
<div id="screen-appel">
  <div class="top-bar">
    <button class="back-btn" onclick="goHome()">← Retour</button>
    <div class="top-info">
      <div class="top-voice" id="top-voice">—</div>
      <div class="top-date" id="top-date">—</div>
    </div>
    <div class="top-count" id="top-count">0 / 0</div>
  </div>

  <div class="legend">
    <span class="leg"><span class="leg-dot" style="background:var(--present)"></span>Présent·e</span>
    <span class="leg"><span class="leg-dot" style="background:var(--prevu)"></span>Absent prévu</span>
    <span class="leg"><span class="leg-dot" style="background:var(--autre)"></span>Autre</span>
  </div>

  <div id="prefill-banner" class="prefill-note" style="display:none">
    📋 Pré-remplissage — répétition <strong id="prefill-date">—</strong>. Modifiable jusqu'au soir J.
  </div>

  <div class="choriste-list" id="choriste-list"></div>

  <div class="send-bar">
    <div class="send-info">
      <strong id="count-done">0</strong> / <strong id="count-total">0</strong> saisi·e·s
    </div>
    <button class="send-btn" id="send-btn" onclick="sendAppel()" disabled>
      Envoyer l'appel
    </button>
  </div>
</div>

<div id="toast"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxd2zaWu5bBZAf4M6koW8mhK0FlNw_h2DGXkxeb0niMotaGlslbwjHyUmFqtA2r9n3/exec";

let currentVoice = "";
let statuses = {};
let names = [];

// Calcule la date du prochain lundi (ou lundi en cours si on est lundi)
function getNextMonday() {
  const now = new Date();
  const day = now.getDay(); // 0=dim, 1=lun...
  const diff = day === 1 ? 0 : (8 - day) % 7 || 7;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diff);
  return monday;
}

function formatISO(d) {
  return d.toISOString().split("T")[0];
}
function formatFR(d) {
  return d.toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
}

function isToday(d) {
  const now = new Date();
  return d.toDateString() === now.toDateString();
}

// Init date badge accueil
const nextMonday = getNextMonday();
document.getElementById("next-repet").textContent = formatFR(nextMonday);

// Afficher bannière pré-remplissage si pas encore lundi
const prefillBanner = document.getElementById("prefill-banner");
const prefillDateEl = document.getElementById("prefill-date");
prefillDateEl.textContent = formatFR(nextMonday);

function showToast(msg, duration = 2800) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), duration);
}

async function startAppel(voice) {
  currentVoice = voice;
  statuses = {};
  names = [];

  document.getElementById("screen-home").style.display = "none";
  document.getElementById("screen-appel").style.display = "block";
  document.getElementById("top-voice").textContent = voice;
  document.getElementById("top-date").textContent = formatFR(nextMonday);

  // Bannière pré-remplissage si pas lundi
  prefillBanner.style.display = isToday(nextMonday) ? "none" : "flex";

  document.getElementById("choriste-list").innerHTML =
    `<div style="text-align:center;padding:3rem;color:var(--muted)"><span class="spinner"></span> Chargement…</div>`;

  try {
    const res = await fetch(`${SCRIPT_URL}?voice=${voice}`);
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    names = data.names;
    renderList();
  } catch(e) {
    document.getElementById("choriste-list").innerHTML =
      `<div style="text-align:center;padding:3rem;color:var(--prevu)">⚠️ Impossible de charger la liste.<br><small>${e.message}</small></div>`;
  }
}

function renderList() {
  const list = document.getElementById("choriste-list");
  list.innerHTML = "";
  names.forEach(name => {
    const safe = name.replace(/'/g, "\\'");
    const card = document.createElement("div");
    card.className = "choriste-card";
    card.id = `card-${CSS.escape(name)}`;
    card.innerHTML = `
      <div class="choriste-name">${name}</div>
      <div class="status-btns">
        <button class="s-btn" onclick="setStatus(this,'${safe}','present')">Présent·e</button>
        <button class="s-btn" onclick="setStatus(this,'${safe}','prevu')">Absent prévu</button>
        <button class="s-btn" onclick="setStatus(this,'${safe}','autre')">Autre</button>
      </div>`;
    list.appendChild(card);
  });
  updateCount();
}

function setStatus(btn, name, status) {
  statuses[name] = status;
  const card = document.getElementById(`card-${CSS.escape(name)}`);
  card.className = "choriste-card done-" + status;
  card.querySelectorAll(".s-btn").forEach(b => b.className = "s-btn");
  btn.classList.add("active-" + status);
  updateCount();
}

function updateCount() {
  const done = Object.keys(statuses).length;
  const total = names.length;
  document.getElementById("count-done").textContent = done;
  document.getElementById("count-total").textContent = total;
  document.getElementById("top-count").textContent = `${done} / ${total}`;
  document.getElementById("send-btn").disabled = done === 0;
}

function goHome() {
  document.getElementById("screen-appel").style.display = "none";
  document.getElementById("screen-home").style.display = "flex";
}

async function sendAppel() {
  const btn = document.getElementById("send-btn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Envoi…`;

  const records = names
    .filter(n => statuses[n])
    .map(n => ({ name: n, status: statuses[n] }));

  const payload = {
    voice: currentVoice,
    date: formatISO(nextMonday),
    records
  };

  try {
    const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
    showToast(`✅ Appel ${currentVoice} enregistré pour le ${formatFR(nextMonday)} !`);
    setTimeout(goHome, 2500);
  } catch(e) {
    showToast(`⚠️ Erreur : ${e.message}`, 4000);
    btn.disabled = false;
    btn.textContent = "Réessayer";
  }
}
</script>
</body>
</html>
